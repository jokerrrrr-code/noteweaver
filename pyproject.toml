[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noteweaver"
version = "0.0.1.dev0"
description = "Shared data contracts for lecture-linked supplementary notes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
classifiers = ["Development Status :: 2 - Pre-Alpha", "Private :: Do Not Upload"]

[project.urls]
Homepage = "https://github.com/jokerrrrr-code/noteweaver"
Repository = "https://github.com/jokerrrrr-code/noteweaver"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noteweaver = ["py.typed"]
