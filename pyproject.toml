[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "noteweaver"
dynamic = ["version"]
description = "Lecture-linked notes with PDF reading, AI drafts, editing, and project persistence"
readme = "README.md"
license-files = ["THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
]
keywords = ["lecture", "study", "notes", "pdf", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Typing :: Typed",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
export = [
    "PyMuPDF>=1.26.7,<3",
]
preview = [
    "pypdfium2>=4.0",
    "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/jokerrrrr-code/noteweaver"
Repository = "https://github.com/jokerrrrr-code/noteweaver"
Documentation = "https://github.com/jokerrrrr-code/noteweaver/blob/main/docs/README.md"
Issues = "https://github.com/jokerrrrr-code/noteweaver/issues"

[tool.setuptools.dynamic]
version = {attr = "noteweaver._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noteweaver = ["py.typed"]
